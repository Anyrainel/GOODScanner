name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract version
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $tag = "v$date"
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Toolchain
        run: rustup default stable-msvc

      - name: Test user-facing error diagnostics
        run: |
          cargo test -p genshin_scanner --lib updater::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p good_tools_app --features test-as-invoker --test ui_error --test update_restart --test shared_games

      - name: Set version in Cargo.toml
        run: |
          $files = @(
              './Cargo.toml'
              './yas/Cargo.toml'
              './genshin/Cargo.toml'
              './application/Cargo.toml'
          )
          # Pack the date into major and the release build into minor.
          # Cargo requires 3-part semver; pack YYYYMMDD into major
          $d = Get-Date -Format "yyyyMMdd"
          $ver = "$d.${{ github.run_number }}.0"
          [regex]$pattern = '(?<=version = ").*(?=")'
          foreach ($file in $files) {
              $pattern.Replace((Get-Content -Raw $file), $ver, 1) | Out-File -FilePath $file
          }
          # Stable roles allow installed transition builds to find renamed
          # assets later. Keep these filenames in sync with release uploads.
          @{
            tag = $env:VERSION
            revision = [int]${{ github.run_number }}
            assets = @{
              scanner = "GOODScanner-${{ github.run_number }}.exe"
              capture = "GOODCapture-${{ github.run_number }}.exe"
            }
          } |
            ConvertTo-Json | Set-Content -Encoding utf8 update.json

      - name: Build GOODScanner (Release)
        run: cargo build --release --bin GOODScanner

      - name: Build GOODCapture (Release)
        run: cargo build --release --bin GOODCapture --features capture

      - name: Preserve revision-specific download names
        run: |
          Copy-Item target/release/GOODScanner.exe target/release/GOODScanner-${{ github.run_number }}.exe
          Copy-Item target/release/GOODCapture.exe target/release/GOODCapture-${{ github.run_number }}.exe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GOODScanner_${{ env.VERSION }}
          path: |
            target/release/GOODScanner.exe
            target/release/GOODCapture.exe

      - name: Delete existing release if any
        run: gh release delete $env:VERSION --yes --cleanup-tag 2>$null
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: "Build revision: ${{ github.run_number }}"
          files: |
            target/release/GOODScanner.exe
            target/release/GOODCapture.exe
            update.json
            target/release/GOODScanner-${{ github.run_number }}.exe
            target/release/GOODCapture-${{ github.run_number }}.exe
          make_latest: true
