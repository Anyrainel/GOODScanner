[workspace]
resolver = "2"
members = ["."]

[package]
name = "hsr_scanner_experimental"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Isolated experimental Honkai: Star Rail capture, OCR scanner, and attended manager"
license = "GPL-2.0-or-later"
publish = false

[features]
default = []
experimental-hsr = []
# Internal test-only escape hatch. build.rs honors this only for debug builds,
# so a release executable can never lose its administrator manifest.
test-as-invoker = []

[dependencies]
clap = { version = "4.4", features = ["derive"] }
enigo = "0.1"
env_logger = "0.11"
image = "0.24"
log = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
yas = { path = "../../yas", package = "yas_core", features = ["ort", "capturer_wgc"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1"

[[bin]]
name = "HSRScannerExperimental"
path = "src/bin/hsr_scanner_experimental.rs"
required-features = ["experimental-hsr"]
test = false
