[package]
name = "hsr_scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Honkai: Star Rail capture, OCR scanner, export, and attended manager for GOODScanner"
license = "GPL-2.0-or-later"
publish = false

[features]
default = []
capture = [
    "dep:etherparse",
    "dep:kcp",
    "dep:protobuf",
    "dep:rand_mt",
    "dep:thiserror",
    "dep:tracing",
    "dep:base64",
    "dep:futures",
    "dep:pktmon",
    "dep:tokio",
    "dep:tokio-util",
]
# Internal test-only hooks for deterministic boundary and cleanup tests.
test-as-invoker = []

[dependencies]
enigo = "0.1"
image = "0.24"
log = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
yas = { path = "../../yas", package = "yas_core", features = ["ort", "capturer_wgc"] }

# Packet capture is compiled only into GOODCapture.
etherparse = { version = "0.17", optional = true }
kcp = { version = "0.5", optional = true }
protobuf = { version = "=3.7.1", optional = true }
rand_mt = { version = "5.0", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
tokio-util = { version = "0.7", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
pktmon = { version = "0.6", features = ["tokio"], optional = true }
